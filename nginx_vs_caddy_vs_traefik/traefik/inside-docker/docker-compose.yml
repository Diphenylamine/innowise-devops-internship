services:
  app1:
    build: ../app
    hostname: app1
    expose:
      - "5000"
  app2:
    build: ../app
    hostname: app2
    expose:
      - "5000"
  app3:
    build: ../app
    hostname: app3
    expose:
      - "5000"
  traefik:
    image: traefik:v3.1
    ports:
      - "8094:80"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - app1
      - app2
      - app3
