services:
  app1:
    build: ../app
    hostname: app1
    expose:
      - "5000"

  app2:
    build: ../app
    hostname: app2
    expose:
      - "5000"

  app3:
    build: ../app
    hostname: app3
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./inside-docker-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3