services:
  jenkins:
    build:
      context: ../../..
      dockerfile: pro-track/module-02-jenkins/resources/v2.Dockerfile.jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home_v2:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home_v2:
